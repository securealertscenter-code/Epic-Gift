<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><meta name="theme-color" content="#0d0e13"><title>هدیه حماسی</title><link rel="stylesheet" href="epic_gift.css">
</head><body><main class="app">
<header class="topbar"><button class="icon-btn">‹</button><div class="brand"><span class="brand-star">✦</span><strong>هدیه حماسی</strong></div><div class="top-actions"><button class="icon-btn">⌄</button><button class="icon-btn">⋮</button></div></header>
<section class="account"><div class="profile-gem"><span class="chess-shape"></span></div><div class="balance"><span class="muted">موجودی شما</span><div class="balance-line"><span class="ton-symbol">◇</span><strong>0.006</strong></div></div><button class="deposit">واریز <span>▣</span></button></section>
<section class="live-section"><div class="live-label"><span class="live-dot"></span><strong>زنده</strong></div><div class="live-row"><div class="premium-gift purple"><span class="diamond"></span></div><div class="premium-gift gold"><span class="crown"></span></div><div class="premium-gift blue"><span class="spark"></span></div><div class="premium-gift violet"><span class="diamond small"></span></div></div></section>
<section class="hero-grid"><button class="hero-card contracts"><span class="hero-art diamond"></span><span class="hero-title">معاملات برای هدایای</span><span class="hero-sub">TON</span><span class="arrow">‹</span></button><button class="hero-card upgrade"><span class="hero-art star"></span><span class="hero-title">ارتقا هدیه</span><span class="hero-sub">هدیه رویایی انتخاب کنید</span><span class="arrow">‹</span></button></section>
<section class="section-heading"><strong>بازی‌ها</strong><span>همه را ببینید ‹</span></section>
<section class="games"><button class="game-card rocket"><span class="game-art rocket-art"></span><strong>راکت</strong><small>تا ستاره‌ها برو</small></button><button class="game-card mines"><span class="game-art mine-art"></span><strong>ماین</strong><small>از مین‌ها دوری کن</small></button><button class="game-card plinko"><span class="game-art plinko-art"></span><strong>پلینکو</strong><small>تا 1000 برابر</small></button><button class="game-card crafts"><span class="game-art craft-art"></span><strong>کرافت</strong><small>هدایا را ترکیب کن</small></button><button class="game-card pvp"><span class="game-art pvp-art">VS</span><strong>PvP</strong><small>برای بانک بجنگ</small></button><button class="game-card boxes"><span class="game-art box-art"></span><strong>باکس‌ها</strong><small>هدایای پریمیوم</small></button></section>
<nav class="bottom-nav"><button><span class="nav-icon backpack-icon"></span><small>کوله پشتی</small></button><button><span class="nav-icon invite-icon"></span><small>دعوت کردن</small></button><button class="active"><span class="nav-icon home-icon"></span><small>خانه</small></button><button><span class="nav-icon leaderboard-icon"></span><small>جدول امتیازات</small></button><button class="earn"><i>8</i><span class="nav-icon earn-icon"></span><small>کسب درآمد</small></button></nav>
</main><script src="epic_gift.js"></script></body></html>
