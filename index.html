<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Epic Gift</title><link rel="stylesheet" href="epic_gift.css">
</head>
<body><div class="app">
<header class="top"><button class="round">←</button><div class="brand"><span class="brandmark">✦</span><b>Epic Gift</b></div><div class="top-actions"><button class="round">⌄</button><button class="round">⋮</button></div></header>
<section class="account"><div class="avatar">♟</div><div class="bal"><small>Your balance</small><div><span class="ton">◈</span><strong>0.006</strong></div></div><button class="deposit">▣ Deposit</button></section>
<section class="live"><div class="live-title"><i></i><b>LIVE</b></div><div class="live-row"><div class="gift g1">✦</div><div class="gift g2">♛</div><div class="gift g3">✧</div><div class="gift g4">♢</div><div class="gift g5">❀</div><div class="gift g6">✦</div></div></section>
<section class="main-cards"><button class="wide contracts"><span class="art">◈</span><div><b>Contracts</b><small>Trade gifts for TON</small></div><em>›</em></button><button class="wide upgrade"><span class="art">✦</span><div><b>Upgrade</b><small>Choose a dream gift</small></div><em>›</em></button></section>
<section class="section-title"><b>Games</b><span>See all ›</span></section>
<section class="games"><button class="game mines"><span class="big">✹</span><b>Mines</b><small>Dodge the mines</small></button><button class="game plinko"><span class="big">•••</span><b>Plinko</b><small>Win up to 1000x</small></button><button class="game crafts"><span class="big">◇</span><b>Crafts</b><small>Merge your gifts</small></button><button class="game rocket"><span class="big">↗</span><b>Rocket</b><small>Reach the stars</small></button><button class="game pvp"><span class="big">VS</span><b>PvP</b><small>Fight for the bank</small></button><button class="game boxes"><span class="big">▣</span><b>Boxes</b><small>Open premium gifts</small></button></section>
<nav class="bottom"><button><span>⬡</span><small>Backpack</small></button><button><span>♧</span><small>Invite</small></button><button class="active"><span>⌂</span><small>Home</small></button><button><span>♜</span><small>Leaderboard</small></button><button class="earn"><i>8</i><span>◉</span><small>Earn</small></button></nav>
</div><script src="epic_gift.js"></script></body></html>
