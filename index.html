<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Epic Gift</title>
<link rel="stylesheet" href="epic_gift.css">
</head>
<body>
<div class="app">
  <header class="tgbar">
    <div class="tg-title">Epic Gift</div><button class="xbtn">×</button>
  </header>
  <main>
    <section class="walletbar">
      <div class="online"><i></i> زنده</div>
      <div class="balance"><span class="tondot">◆</span><b>0</b> TON</div>
      <button class="plus">+</button><div class="profile">EG</div>
    </section>

    <section class="live">
      <div class="live-label"><i></i> هدیه‌های زنده</div>
      <div class="live-strip">
        <div class="mini-gift purple"><span class="gem"></span></div>
        <div class="mini-gift blue"><span class="star"></span></div>
        <div class="mini-gift gold"><span class="crown"></span></div>
        <div class="mini-gift violet"><span class="diamond"></span></div>
        <div class="mini-gift pink"><span class="flower"></span></div>
        <div class="mini-gift cyan"><span class="orb"></span></div>
      </div>
    </section>

    <section class="hero-grid">
      <button class="hero contracts"><span class="hero-art giftbox"><i></i></span><strong>مبادلات برای<br>هدایای شما</strong><small>ارزش هدایای خود را بالا ببرید</small><em>›</em></button>
      <button class="hero upgrade"><span class="hero-art upgradebox"><i></i></span><strong>ارتقای هدیه</strong><small>هدیه رویایی انتخاب کنید</small><em>›</em></button>
    </section>

    <section class="section-head"><h1>بازی‌ها</h1><button>همه را ببینید ‹</button></section>
    <section class="games">
      <button class="game mines" data-game="mines"><div class="art"><div class="mine"></div><span class="spark a"></span><span class="spark b"></span><span class="spark c"></span></div><strong>Mines</strong><small>دور از مین‌ها حرکت کن</small></button>
      <button class="game rocket" data-game="rocket"><div class="art"><div class="rocket-body"><i class="window"></i><i class="fin left"></i><i class="fin right"></i></div><div class="rocket-flame"></div></div><strong>Rocket</strong><small>Rocket Mode</small></button>
      <button class="game pvp" data-game="pvp"><div class="art"><span class="blade one"></span><span class="blade two"></span><b>VS</b></div><strong>PvP</strong><small>Fight for the bank</small></button>
      <button class="game boxes" data-game="boxes"><div class="art"><div class="case"><i></i></div><span class="shine"></span></div><strong>Boxes</strong><small>Open a surprise</small></button>
      <button class="game farm" data-game="farm"><div class="art"><div class="farmbox"><i></i></div><span class="coins">◆</span></div><strong>Farm Box</strong><small>Any Telegram Gift</small></button>
      <button class="game free" data-game="free"><div class="art"><div class="freebox"><i>24</i></div><span class="free-star">✦</span></div><strong>FREE24</strong><small>Free box every day</small></button>
    </section>
  </main>
  <nav class="bottom">
    <button><span>▢</span><small>کوله پشتی</small></button>
    <button><span>♧</span><small>دعوت کردن</small></button>
    <button class="active"><span>⌂</span><small>خانه</small></button>
    <button><span>▥</span><small>جدول امتیازات</small></button>
    <button class="income"><b>8</b><span>◉</span><small>کسب درآمد</small></button>
  </nav>
</div>
<script src="epic_gift.js"></script>
</body>
</html>
