<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Epic Gift</title>
<link rel="stylesheet" href="epic_gift.css">
</head>
<body>
<header class="top">
  <button class="pill">✕ <span>Close</span></button>
  <div class="brand"><span class="gift">🎁</span> Epic Gift</div>
  <button class="pill menu">⌄ <span>⋮</span></button>
</header>

<main>
  <section class="wallet">
    <div class="profile">
      <div class="avatar">🕶️</div>
      <div>
        <div class="muted">Your balance</div>
        <div class="balance"><span class="ton">◇</span> <b>12.057</b></div>
      </div>
    </div>
    <button class="deposit">▣ &nbsp; Deposit</button>
  </section>

  <section class="live">
    <div class="live-title"><i></i><b>Live</b></div>
    <div class="live-row">
      <div class="live-item yellow">🧢</div>
      <div class="live-item aqua">◇</div>
      <div class="live-item yellow">🐈‍⬛</div>
      <div class="live-item blue">🐸</div>
      <div class="live-item aqua">◇</div>
      <div class="live-item blue">◇</div>
    </div>
  </section>

  <section class="hero-list">
    <article class="hero rocket">
      <div class="tag">⚡ HOT!</div>
      <div class="hero-title">🚀 ROCKET</div>
      <div class="rocket-art">🚀</div>
      <div class="mult m1">x5.66</div><div class="mult m2">x2.05</div><div class="mult m3">x3.28</div>
    </article>
    <article class="hero pvp">
      <div class="tag">♨ NEW!</div>
      <div class="hero-title">⚔ PVP</div>
      <div class="players">
        <span>CRYPTO<br><b>3.7%</b></span><span>DEGEN<br><b>7.1%</b></span><span>MIKE_K<br><b>5.2%</b></span><span>TONN<br><b>4.4%</b></span>
      </div>
    </article>
    <article class="hero hub">
      <div class="tag">♨ HOT</div>
      <div class="hero-title">🎮 PLAY HUB</div>
      <div class="games"><b>Upgrade</b><b>Plinko</b><b>Mines</b></div>
    </article>
  </section>

  <section class="free-grid">
    <article class="free free24"><div>FREE<span>24</span></div><strong>💍</strong></article>
    <article class="free free0"><div>FREE</div><strong>🍭</strong></article>
  </section>

  <section class="gift-boxes">
    <h2>Gift Boxes <span>View all</span></h2>
    <div class="gift-grid">
      <article class="gift-card green"><div class="art">🐸💎</div><footer><b>Farm</b><button>0.1 ◇</button></footer></article>
      <article class="gift-card"><div class="art">🧢💎</div><footer><b>Autumn</b><button>3.5 ◇</button></footer></article>
      <article class="gift-card"><div class="art">🎬🍿</div><footer><b>Movie</b><button>4 ◇</button></footer></article>
      <article class="gift-card"><div class="art">🪐🚀</div><footer><b>Space</b><button>6 ◇</button></footer></article>
    </div>
  </section>
</main>

<nav class="bottom">
  <a>▣<span>Backpack</span></a>
  <a>♧<span>Invite</span></a>
  <a class="active">⌂<span>Home</span></a>
  <a>♜<span>Leaderboard</span></a>
  <a>⇄<span>P2P</span></a>
</nav>
<script src="epic_gift.js"></script>
</body>
</html>
