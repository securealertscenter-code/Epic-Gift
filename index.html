<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Epic Gift</title>
  <link rel="stylesheet" href="epic_gift.css">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <button class="back-btn">
      <span>←</span>
      <b>بازگشت</b>
    </button>

    <div class="logo">
      <div class="logo-icon">🎁</div>
      <strong>Epic Gift</strong>
    </div>

    <div class="header-actions">
      <button>⌄</button>
      <button>⋮</button>
    </div>

  </header>


  <!-- ACCOUNT -->
  <section class="account">

    <div class="profile-image">
      <img src="assets/profile.jpg" alt="">
      <span>◆</span>
    </div>

    <div class="balance">
      <small>Your balance</small>

      <div class="balance-value">
        <div class="ton-logo">◈</div>
        <strong>0.006</strong>
      </div>
    </div>

    <button class="deposit-btn">
      <span>▣</span>
      Deposit
    </button>

  </section>


  <!-- LIVE -->
  <section class="live-section">

    <div class="live-label">
      <span></span>
      Live
    </div>

    <div class="live-items">

      <div class="live-item blue">
        <img src="assets/live/ton.png">
      </div>

      <div class="live-item purple">
        <img src="assets/live/gift1.png">
      </div>

      <div class="live-item yellow">
        <img src="assets/live/gift2.png">
      </div>

      <div class="live-item purple">
        <img src="assets/live/gift3.png">
      </div>

      <div class="live-item pink">
        <img src="assets/live/gift4.png">
      </div>

      <div class="live-item blue">
        <img src="assets/live/ton.png">
      </div>

    </div>

  </section>


  <!-- UPGRADE -->
  <section class="hero-card upgrade-card">

    <span class="hot-label">♨ HOT</span>

    <div class="hero-text">
      <h1>Upgrade</h1>
      <p>Choose a dream gift</p>
    </div>

    <img src="assets/cards/upgrade.png"
         class="hero-image"
         alt="Upgrade">

    <div class="upgrade-percent">
      24%
    </div>

  </section>


  <!-- GAMES -->
  <section class="games-grid">

    <button class="game-card mines">
      <img src="assets/cards/mines.png" alt="">
      <div class="game-info">
        <h2>Mines <span>NEW</span></h2>
        <p>Dodge the mines</p>
      </div>
    </button>


    <button class="game-card plinko">
      <img src="assets/cards/plinko.png" alt="">
      <div class="game-info">
        <h2>Plinko</h2>
        <p>Win up to 1000x</p>
      </div>
    </button>


    <button class="game-card crafts">
      <img src="assets/cards/crafts.png" alt="">
      <div class="game-info">
        <h2>Crafts</h2>
        <p>Merge your gifts</p>
      </div>
    </button>


    <button class="game-card dice">
      <img src="assets/cards/dice.png" alt="">
      <div class="game-info">
        <h2>Dice</h2>
        <p>Higher or Lower</p>
      </div>
    </button>

  </section>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button>
      <span>⬡</span>
      <small>Backpack</small>
    </button>

    <button>
      <span>♧</span>
      <small>Invite</small>
    </button>

    <button class="active">
      <span>⌂</span>
      <small>Home</small>
    </button>

    <button>
      <span>♜</span>
      <small>Leaderboard</small>
    </button>

    <button class="earn">
      <span>◉</span>
      <i>8</i>
      <small>Earn</small>
    </button>

  </nav>

</div>

<script src="epic_gift.js"></script>

</body>
</html>
