<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#171719">
  <title>Epic Gift <span class="v3-badge">V3</span></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="epic_gift.css">
<style>.v3-badge{display:inline-flex;margin-left:6px;padding:3px 7px;border-radius:8px;background:linear-gradient(135deg,#9a6bff,#6033cf);color:#fff;font:800 9px Arial;letter-spacing:.5px;vertical-align:middle}</style></head>
<body>
  <div id="app">
    <header class="tg-head">
      <button class="tg-icon" id="closeBtn" aria-label="Close">×</button>
      <strong>Epic Gift</strong>
      <div class="tg-right">
        <button class="tg-chevron" aria-label="Expand">⌄</button>
        <button class="tg-icon dots" id="menuBtn" aria-label="Menu">•••</button>
      </div>
    </header>

    <main id="screen" class="screen">
      <section class="balance-card">
        <div class="balance-copy">
          <span>Your balance</span>
          <div class="balance-value"><b id="balance">0.000</b><span class="ton">◉</span></div>
        </div>
        <button class="wallet-btn" id="walletBtn"><span>▱</span><b>＋</b></button>
        <div class="avatar" id="avatar"><span></span></div>
      </section>

      <section class="live-section">
        <div class="live-label"><i></i><b>LIVE</b></div>
        <div class="live-strip" id="liveStrip">
          <div class="live-gift heart">♥</div>
          <div class="live-gift peach">●</div>
          <div class="live-gift sword">╱</div>
          <div class="live-gift star">✦</div>
          <div class="live-gift flower">✿</div>
          <div class="live-gift gem">⬟</div>
        </div>
      </section>

      <section class="mode-grid">
        <button class="mode-card contracts" data-page="contracts">
          <span class="mode-icon">⇄</span>
          <div><small>PLAY MODE</small><b>Contracts</b></div><em>›</em>
        </button>
        <button class="mode-card upgrade" data-page="upgrade">
          <span class="mode-icon">↗</span>
          <div><small>PLAY MODE</small><b>Upgrade</b></div><em>›</em>
        </button>
        <button class="mode-card rocket" data-page="rocket">
          <span class="mode-icon">⌁</span>
          <div><small>PLAY MODE</small><b>Rocket</b></div><em>›</em>
        </button>
        <button class="mode-card pvp" data-page="pvp">
          <span class="mode-icon">⚔</span>
          <div><small>BATTLE MODE</small><b>PvP</b></div><em>›</em>
        </button>
      </section>

      <section class="boxes">
        <div class="section-title"><h2>Gift Boxes</h2><button id="allBoxes">View all</button></div>
        <div class="box-grid">
          <button class="box-card free24" data-page="free24">
            <div class="box-art"><span>24</span><b>FREE</b></div>
            <strong>FREE24</strong><small>Every 24 hours</small>
          </button>
          <button class="box-card farm" data-page="farm">
            <div class="box-art"><span>🎁</span></div>
            <strong>FARM BOX</strong><small>Any gift can drop</small>
          </button>
          <button class="box-card" data-page="shop">
            <div class="box-art gift-pink">♥</div>
            <strong>Heart Locket</strong><small>Rare collection</small>
          </button>
          <button class="box-card" data-page="shop">
            <div class="box-art gift-blue">◆</div>
            <strong>Ion Gem</strong><small>Premium gift</small>
          </button>
        </div>
      </section>

      <section class="discover">
        <button class="discover-card" data-page="hub">
          <span class="play-box">▶</span>
          <div><small>DISCOVER</small><b>Play Hub</b></div>
          <em>›</em>
        </button>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-nav="backpack"><span>▣</span><small>Backpack</small></button>
      <button data-nav="invite"><span>♧</span><small>Invite</small></button>
      <button data-nav="home" class="active"><span>⌂</span><small>Home</small></button>
      <button data-nav="leaderboard"><span>▥</span><small>Leaderboard</small></button>
      <button data-nav="earn"><span>◉</span><small>Earn</small></button>
    </nav>

    <div id="overlay" class="overlay hidden"></div>
    <div id="sheet" class="sheet hidden"></div>
  </div>
  <script src="epic_gift.js"></script>
</body>
</html>
