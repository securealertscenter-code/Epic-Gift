<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Epic Gift</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="close">× <span>Close</span></button>
    <div class="brand"><div class="brand-icon">✦</div><b>Epic Gift</b></div>
    <div class="top-actions"><button class="drop">⌄</button><button class="dots">⋮</button></div>
  </header>

  <section class="balance">
    <div class="profile"><div class="avatar">●</div><div><div class="muted">Your balance</div><div class="amount"><span class="ton">◆</span> 12.057</div></div></div>
    <button class="deposit">Deposit</button>
  </section>

  <main>
    <section class="live"><div class="live-title"><i></i><span>Live</span></div><div class="live-row" id="liveRow"></div></section>

    <section class="hero rocket-card">
      <div class="tag">HOT!</div><h1>ROCKET</h1><div class="rocket-copy">Watch the multiplier rise</div>
      <div class="rocket-art"><div class="flame"></div><div class="rocket-body"><span></span></div></div>
      <div class="multipliers"><b>x5.66</b><b>x3.28</b><b>x2.05</b><b>x1.24</b></div>
    </section>

    <section class="hero pvp-card">
      <div class="tag yellow">NEW!</div><h2>PVP</h2><div class="players" id="players"></div>
    </section>

    <section class="hero hub-card">
      <div class="hub-head"><div><span class="tag pink">HOT</span><h2>Play Hub</h2></div><span class="arrow">›</span></div>
      <div class="games"><div class="game"><div class="game-icon upgrade">↗</div><b>Upgrade</b></div><div class="game"><div class="game-icon plinko">●</div><b>Plinko</b></div><div class="game"><div class="game-icon mines">✦</div><b>Mines</b></div></div>
    </section>

    <section class="twocards"><div class="small-card free24"><span class="smalltag">FREE</span><h3>FREE24</h3><p>Daily reward</p><div class="giftbox">🎁</div></div><div class="small-card free"><span class="smalltag">FREE</span><h3>FREE</h3><p>Claim your gift</p><div class="giftbox">🎁</div></div></section>
  </main>

  <nav class="bottom"><button data-page="backpack">▣<span>Backpack</span></button><button data-page="invite">♧<span>Invite</span></button><button class="active" data-page="home">⌂<span>Home</span></button><button data-page="leaderboard">♛<span>Leaderboard</span></button><button data-page="p2p">⇄<span>P2P</span></button></nav>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
