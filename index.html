<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Epic Gift</title><link rel="stylesheet" href="epic_gift.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="live"><span class="dot"></span><span>زنده</span></div>
    <div class="balance"><span class="coin">◆</span><b>0</b><span>TON</span></div>
    <button class="plus" aria-label="افزودن">+</button>
    <div class="avatar">EG</div>
  </header>

  <section class="gift-strip" aria-label="هدایای زنده">
    <div class="gift-mini purple"><span class="diamond"></span></div>
    <div class="gift-mini gold"><span class="crown"></span></div>
    <div class="gift-mini blue"><span class="star"></span></div>
    <div class="gift-mini violet"><span class="diamond"></span></div>
  </section>

  <main>
    <section class="hero-grid">
      <article class="hero-card green">
        <div class="shine"></div><div class="hero-art giftbox green-art"><span class="box-lid"></span><span class="box-body"></span><span class="ribbon"></span></div>
        <div class="hero-copy"><h2>ارتقای هدیه</h2><p>هدیه رویایی انتخاب کنید</p></div><span class="arrow">‹</span>
      </article>
      <article class="hero-card purple-card">
        <div class="shine"></div><div class="hero-art giftbox purple-art"><span class="box-lid"></span><span class="box-body"></span><span class="ribbon"></span></div>
        <div class="hero-copy"><h2>مبادلات برای هدایای</h2><p>TON</p></div><span class="arrow">‹</span>
      </article>
    </section>

    <div class="section-head"><h1>بازی‌ها</h1><a>همه را ببینید ›</a></div>
    <section class="games">
      <button class="game-card rocket-card" data-game="rocket"><div class="game-bg"></div><div class="rocket"><div class="rocket-window"></div><div class="rocket-fin left"></div><div class="rocket-fin right"></div><div class="flame"><i></i></div></div><h3>راکت</h3><p>تا ستاره‌ها برو</p></button>
      <button class="game-card mines-card" data-game="mines"><div class="game-bg"></div><div class="mine-art"><span></span><span></span><span></span><span></span><b></b></div><h3>ماین</h3><p>از مین‌ها دوری کن</p></button>
      <button class="game-card orange-card"><div class="game-bg"></div><div class="crate-art"><div class="crate-top"></div><div class="crate-front"></div><div class="crate-side"></div></div><h3>قراردادها</h3><p>هدایای خود را معامله کن</p></button>
      <button class="game-card violet-card"><div class="game-bg"></div><div class="plinko"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><h3>پلی‌نکو</h3><p>شانس خود را امتحان کن</p></button>
      <button class="game-card blue-card"><div class="game-bg"></div><div class="pvp-art"><span></span><b>VS</b><i></i></div><h3>PvP</h3><p>رقابت با بازیکنان</p></button>
      <button class="game-card gold-card"><div class="game-bg"></div><div class="box-art"><div></div></div><h3>باکس‌ها</h3><p>جوایز ویژه</p></button>
    </section>
  </main>

  <nav class="bottom-nav">
    <a><span class="nav-ico ring"></span><em>کسب درآمد</em><b class="badge">8</b></a>
    <a><span class="nav-ico bars"></span><em>جدول امتیازات</em></a>
    <a class="active"><span class="nav-ico home"></span><em>خانه</em></a>
    <a><span class="nav-ico club"></span><em>دعوت کردن</em></a>
    <a><span class="nav-ico square"></span><em>کوله پشتی</em></a>
  </nav>
</div>
<script src="epic_gift.js"></script>
</body></html>
